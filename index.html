<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%231E6A47%22/><circle cx=%2250%22 cy=%2250%22 r=%2218%22 fill=%22%237FD07A%22/></svg>">
<title>장영실 AI 로봇 미션 챌린지 점수판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=JetBrains+Mono:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 전자칠판 가로 화면. 왼쪽 팀 카드 그리드, 오른쪽 개인 순위 + 미션 현황. 학생을 누르면 채점 창이 열림. */
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
:root{
  --bg:#EEF3EA; --panel:#FFFFFF; --ink:#16271D; --muted:#5D6F62; --line:#D5DFD0;
  --canopy:#1E6A47; --canopy-ink:#FFFFFF; --leaf:#DCEEDB;
  --amber:#E2902B; --amber-soft:#FCEBD2; --glow:#7FD07A;
  --danger:#B8402F; --dot-off:#E4EAE0; --dot-off-ink:#9AA99C;
  --shadow:0 1px 2px rgba(22,39,29,.08),0 4px 14px rgba(22,39,29,.06);
  --f-display:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A14; --panel:#17261D; --ink:#E7F0E6; --muted:#9DB0A1; --line:#2A3D31;
  --canopy:#3FA36F; --canopy-ink:#06140C; --leaf:#1F3A2A;
  --amber:#F0A949; --amber-soft:#3A2B16; --glow:#8BE086;
  --danger:#E0705E; --dot-off:#22342A; --dot-off-ink:#5F7566;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A14; --panel:#17261D; --ink:#E7F0E6; --muted:#9DB0A1; --line:#2A3D31;
  --canopy:#3FA36F; --canopy-ink:#06140C; --leaf:#1F3A2A;
  --amber:#F0A949; --amber-soft:#3A2B16; --glow:#8BE086;
  --danger:#E0705E; --dot-off:#22342A; --dot-off-ink:#5F7566;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html{font-size:clamp(14px,1.02vw,24px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
.brand{display:flex;align-items:baseline;gap:.7rem;flex:1 1 auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:2rem;margin:0;color:var(--canopy);letter-spacing:.01em;text-wrap:balance}
.brand span{color:var(--muted);font-size:.95rem}
.tools{display:flex;gap:.5rem;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:.6rem;padding:.55rem .9rem;font-weight:700;font-size:.95rem;min-height:2.6rem}
.btn:hover{border-color:var(--canopy)}
.btn.primary{background:var(--canopy);color:var(--canopy-ink);border-color:var(--canopy)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.notice{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:.6rem;padding:.55rem .9rem;margin-bottom:.9rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.notice b{color:var(--ink)}

main{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1rem;align-items:start}
@media (max-width:900px){main{grid-template-columns:1fr}}

.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:.8rem}
.team{background:var(--panel);border-radius:.9rem;box-shadow:var(--shadow);padding:.7rem .8rem .6rem;display:flex;flex-direction:column;gap:.35rem}
.team-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;padding:0 .2rem}
.team-name{font-family:var(--f-display);font-size:1.35rem}
.team-total{color:var(--muted);font-size:.9rem}
.team-total b{color:var(--ink);font-size:1.1rem}
.stu{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .6rem;align-items:center;text-align:left;
  background:var(--bg);border:2px solid transparent;border-radius:.7rem;padding:.5rem .65rem;position:relative}
.stu:hover{border-color:var(--canopy)}
.tcard{background:var(--panel);box-shadow:var(--shadow);border-radius:.9rem;padding:.8rem 1rem;gap:.6rem 1rem}
.tc-name{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.tc-name .team-name{font-size:1.7rem;line-height:1.1}
.tc-mem{font-weight:700;font-size:1.15rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .stu-score{font-size:3rem}
/* 한 화면 채우기: 팀 카드가 남는 세로 공간을 나눠 가짐 */
body{display:flex;flex-direction:column}
main{flex:1 1 auto;min-height:0}
.teams{height:100%;grid-auto-rows:1fr;grid-template-columns:repeat(3,minmax(0,1fr))}
.tcard{height:100%;grid-template-rows:1fr auto;align-items:center;padding:1rem 1.2rem}
.tc-name .team-name{font-size:2rem}
.tcard .stu-score{font-size:3.6rem}
.tcard .dots{gap:.3rem}
.tcard .dot{font-size:.75rem}
footer{margin-top:.8rem}
@media (max-width:1100px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.teams{height:auto;grid-auto-rows:auto}}
@media (max-width:600px){.teams{grid-template-columns:1fr}}
.stu-name{font-weight:700;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-score{font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--canopy);justify-self:end}
.stu-score small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:.15rem}
.dots{grid-column:1/-1;display:grid;grid-template-columns:repeat(15,1fr);gap:.18rem}
.dot{aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--dot-off);color:var(--dot-off-ink);font-size:.62rem;font-weight:700;display:grid;place-items:center}
.dot.on{background:var(--glow);color:#0E2A17;box-shadow:0 0 0 2px color-mix(in srgb,var(--glow) 35%,transparent)}
.pop{position:absolute;right:.6rem;top:-.4rem;font-family:var(--f-display);font-size:1.6rem;color:var(--amber);pointer-events:none;animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{border-color:var(--amber);background:var(--amber-soft)}100%{}}

aside{display:flex;flex-direction:column;gap:1rem}
.card{background:var(--panel);border-radius:.9rem;box-shadow:var(--shadow);padding:.8rem .9rem}
.card h2{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 .5rem;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font-family:var(--f-body);font-size:.8rem;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
.rank li{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;align-items:center;gap:.5rem;padding:.35rem .4rem;border-radius:.5rem}
.rank li:nth-child(odd){background:var(--bg)}
.medal{font-family:var(--f-display);font-size:1.15rem;text-align:center;color:var(--muted)}
.rank li:nth-child(1) .medal{color:#C9961A}.rank li:nth-child(2) .medal{color:#8C99A3}.rank li:nth-child(3) .medal{color:#B06A3A}
.rank .who{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rank .who small{color:var(--muted);font-weight:400;margin-left:.3rem}
.rank .pts{font-family:var(--f-display);font-size:1.2rem;color:var(--canopy)}
.empty{color:var(--muted);font-size:.9rem;padding:.3rem}
.rank li.empty{display:block;background:none}
.mstat{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
.ms{background:var(--bg);border-radius:.5rem;padding:.3rem .2rem;text-align:center}
.ms b{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.ms span{font-family:var(--f-display);font-size:1.15rem}
.ms.hit span{color:var(--canopy)}
.ms.zero span{color:var(--dot-off-ink)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:1rem;width:min(72rem,100%);max-height:100%;overflow:auto;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.8rem}
.modal.narrow{width:min(40rem,100%)}
.m-head{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.m-head h3{font-family:var(--f-display);font-weight:400;font-size:1.6rem;margin:0;flex:1 1 auto}
.m-head h3 em{font-style:normal;color:var(--canopy)}
.score-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1rem}
@media (max-width:800px){.score-wrap{grid-template-columns:1fr}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));gap:.45rem;align-content:start}
.mtile{border:2px solid var(--line);background:var(--bg);border-radius:.7rem;padding:.5rem .55rem;text-align:left;display:flex;flex-direction:column;gap:.1rem;min-height:4.6rem}
.mtile .no{font-family:var(--f-display);font-size:.95rem;color:var(--muted)}
.mtile .nm{font-weight:700;font-size:1rem;line-height:1.25}
.mtile .mx{font-size:.75rem;color:var(--muted);margin-top:auto}
.mtile.done{background:var(--leaf)}
.mtile.done .no::after{content:" ✓";color:var(--canopy)}
.mtile.sel{border-color:var(--canopy);box-shadow:0 0 0 3px color-mix(in srgb,var(--canopy) 25%,transparent)}
.detail{background:var(--bg);border-radius:.8rem;padding:.9rem;display:flex;flex-direction:column;gap:.55rem;min-width:0}
.detail h4{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin:0}
.detail .hint{color:var(--muted);font-size:.85rem;margin:0}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6rem;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:.7rem;padding:.6rem .7rem;text-align:left;width:100%;box-sizing:border-box}
.item.on{border-color:var(--canopy);background:var(--leaf)}
.item.off{opacity:.45}
.item .box{width:1.6rem;height:1.6rem;border-radius:.4rem;border:2px solid var(--muted);display:grid;place-items:center;font-weight:900;color:var(--canopy-ink)}
.item.radio .box{border-radius:50%}
.item.on .box{background:var(--canopy);border-color:var(--canopy)}
.item .lb{font-size:1rem;line-height:1.35}
.item .lb.bonus::before{content:"보너스";font-size:.72rem;font-weight:700;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber);border-radius:.3rem;padding:0 .3rem;margin-right:.35rem;vertical-align:.1em}
.item .pv{font-weight:700;color:var(--muted);white-space:nowrap}
.stepper{display:flex;align-items:center;gap:.35rem}
.stepper button{width:2.4rem;height:2.4rem;border-radius:.5rem;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700}
.stepper output{min-width:1.6rem;text-align:center;font-family:var(--f-display);font-size:1.4rem}
.sum{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-top:.3rem;flex-wrap:wrap}
.sum .total{font-family:var(--f-display);font-size:2.2rem;color:var(--canopy)}
.sum .btn.primary{font-size:1.15rem;padding:.7rem 1.4rem}
.placeholder{color:var(--muted);display:grid;place-items:center;min-height:12rem;text-align:center;line-height:1.6}

textarea,input[type=text]{width:100%;box-sizing:border-box;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .7rem}
textarea{min-height:16rem;line-height:1.7;font-size:1rem}
.help{color:var(--muted);font-size:.88rem;line-height:1.6;margin:0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;max-height:60vh;overflow:auto}
.loglist li{display:grid;grid-template-columns:4rem minmax(0,1fr) auto auto;gap:.6rem;align-items:center;background:var(--bg);border-radius:.5rem;padding:.4rem .6rem}
.loglist time{color:var(--muted);font-size:.85rem}
.loglist .d{min-width:0}
.loglist .d small{display:block;color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loglist .p{font-family:var(--f-display);font-size:1.2rem;color:var(--canopy)}
.loglist button{border:1px solid var(--line);background:var(--panel);border-radius:.4rem;padding:.25rem .5rem;font-size:.8rem}
.loglist button.confirm{color:#fff;background:var(--danger);border-color:var(--danger)}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:.7rem;font-weight:700;z-index:60;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.pop,.flash{animation:none}}

/* 팀 구성 */
.modal.wide{width:min(80rem,100%)}
.sec{display:flex;flex-direction:column;gap:.6rem;border-top:1px solid var(--line);padding-top:.9rem}
.sec h4{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0}
.builder{display:grid;grid-template-columns:15rem minmax(0,1fr);gap:.8rem;align-items:start}
@media (max-width:800px){.builder{grid-template-columns:1fr}}
.zone{background:var(--bg);border:2px dashed var(--line);border-radius:.8rem;padding:.6rem;min-height:4rem}
.zone.over{border-color:var(--amber);background:var(--amber-soft)}
.zone.pick{border-color:var(--canopy)}
.pool{position:sticky;top:0;display:flex;flex-direction:column;gap:.4rem}
.pool .zone-h{font-weight:700;color:var(--muted);font-size:.9rem}
.pool .chips{display:flex;flex-wrap:wrap;gap:.35rem}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:.55rem}
.tbox{display:flex;flex-direction:column;gap:.4rem;border-style:solid;background:var(--panel)}
.tbox-h{display:flex;gap:.3rem;align-items:center}
.tbox-h input{padding:.3rem .5rem;font-weight:700;font-family:var(--f-display);font-size:1.1rem}
.tbox-h button{border:1px solid var(--line);background:var(--bg);border-radius:.4rem;width:2rem;height:2rem;flex:none;color:var(--muted)}
.slots{display:flex;flex-direction:column;gap:.3rem}
.slot-empty{border:1.5px dashed var(--line);border-radius:.55rem;padding:.45rem .6rem;color:var(--dot-off-ink);font-size:.9rem}
.chip{display:flex;align-items:center;gap:.4rem;background:var(--panel);border:2px solid var(--line);border-radius:.55rem;padding:.45rem .65rem;font-weight:700;font-size:1.05rem;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tbox .chip{background:var(--leaf);border-color:transparent}
.chip small{color:var(--muted);font-weight:500;font-size:.8rem}
.chip.sel{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 30%,transparent)}
.chip.dragging{opacity:.35}
.chip.ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25);transform:translate(-50%,-60%) rotate(-2deg);border-color:var(--amber);background:var(--panel)}
.chip.over{border-color:var(--amber)}
details.sec summary{cursor:pointer;font-family:var(--f-display);font-size:1.3rem}
details.sec[open] summary{margin-bottom:.6rem}

/* 설문 코드 */
.codes{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;flex-direction:column;gap:1rem;
  padding:max(1rem,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(1rem,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.codes-h{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.codes-h h2{font-family:var(--f-display);font-weight:400;font-size:2.4rem;margin:0;color:var(--canopy);flex:1 1 auto}
.codes-h p{margin:0;color:var(--muted);font-size:1.1rem;flex-basis:100%}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.7rem}
.ccard{background:var(--panel);border-radius:.8rem;box-shadow:var(--shadow);padding:.7rem 1rem;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:.1rem .7rem}
.ccard .cn{font-family:var(--f-display);color:var(--muted);font-size:1.1rem;grid-row:span 2}
.ccard .cname{font-weight:700;font-size:1.3rem}
.ccard .ccode{font-family:var(--f-mono);font-size:2.3rem;font-weight:700;letter-spacing:.12em;color:var(--ink)}

/* 프로그램 헤더 */
:root{--f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; --title:#454A47; --sprout:#7CC242}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--title:#E4EAE5;--sprout:#9AD86A}}
:root[data-theme="dark"]{--title:#E4EAE5;--sprout:#9AD86A}
.hero{position:relative;margin:-.9rem calc(-1 * max(16px,env(safe-area-inset-right,0px))) .9rem calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:.9rem max(16px,env(safe-area-inset-right,0px)) .8rem max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,color-mix(in srgb,var(--sprout) 26%,var(--bg)) 0%,var(--bg) 100%);
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.2rem;align-items:center}
@media (max-width:1100px){.hero{grid-template-columns:auto minmax(0,1fr)}.hero .tools{grid-column:1/-1}}
.logo{height:4.6rem;width:auto;display:block;border-radius:.4rem}
.logo-text{font-family:var(--f-display);font-size:2rem;color:#1C2B12;background:var(--sprout);border:3px solid #1C2B12;border-radius:.5rem;padding:.15rem .7rem;letter-spacing:.04em;white-space:nowrap}
.prog{min-width:0;display:flex;flex-direction:column;gap:.15rem}
.prog .eyebrow{font-weight:900;font-size:1.05rem;color:var(--title)}
.prog .eyebrow .yr,.prog .eyebrow .ds{color:var(--sprout)}
.prog h1{font-family:var(--f-display);font-weight:400;font-size:2.3rem;line-height:1.15;margin:0;color:var(--title);text-wrap:balance}
.prog h1 .cls{color:var(--sprout);margin-left:.3rem}
.prog .meta{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.2rem}
.pill{background:var(--sprout);color:#fff;font-weight:700;border-radius:999px;padding:.2rem .9rem;font-size:.95rem}
.prog .meta span:not(.pill){color:var(--muted);font-size:.9rem}
footer{margin-top:1.2rem;color:var(--muted);font-size:.85rem;display:flex;gap:.4rem 1.2rem;flex-wrap:wrap;justify-content:center}
footer b{color:var(--title)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.5rem}
.info-grid label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted);font-weight:700}
</style>
</head>
<body>

<header class="hero">
  <div><img class="logo" id="logoImg" src="bioglow-logo.png" alt="BIOGLOW"><span class="logo-text" id="logoText" hidden>BIOGLOW</span></div>
  <div class="prog">
    <div class="eyebrow" id="pEyebrow"></div>
    <h1 id="pTitle"></h1>
    <div class="meta"><span class="pill" id="pSession"></span><span>FLL BIOGLOW 로봇 미션 · 팀별 미션 누적 점수</span></div>
  </div>
  <div class="tools">
    <button class="btn" id="undoBtn" type="button">↶ 마지막 기록 취소</button>

<footer><span><b>교육부</b> · 17개 시·도 교육청</span><span><b>한국과학창의재단</b></span><span><b>호서대학교</b> · <b>강원대학교</b></span></footer>
<div id="modalRoot"></div>

<script>
// ---- 미션 데이터 (BIOGLOW 로봇 게임 룰북 8~12쪽) ----
const MISSIONS = [
  {n:1, name:"드론 조사", items:[
    {k:"a", label:"드론이 더 이상 매트에 닿아 있지 않음", pts:20},
    {k:"b", label:"라이다 지도가 완전히 뒤집히고 스캔 마커가 조사 구역 안에 들어감", pts:10, req:"a", bonus:true}]},
  {n:2, name:"씨앗 퍼트리기", items:[
    {k:"a", label:"줄기에서 떨어진 씨앗", pts:10, type:"count", max:3}]},
  {n:3, name:"바위 뒤집기", items:[
    {k:"a", label:"연구 깃발이 내려감", pts:20},
    {k:"b", label:"바위가 원래 시작 위치로 돌아감", pts:10, req:"a", bonus:true}]},
  {n:4, name:"행운의 잎사귀", items:[
    {k:"a", label:"잎사귀 하나를 둥지에 닿지 않게 완전히 제거", pts:10},
    {k:"b", label:"두 번째 잎사귀도 제거하고 여치가 원래 위치에 있음", pts:20, req:"a", bonus:true}],
    hint:"여치가 나뭇잎 서식지 밖으로 완전히 나가면 이 미션은 0점입니다."},
  {n:5, name:"뻗어나가는 뿌리", items:[
    {k:"a", label:"식물 뿌리가 부분적으로 뻗어 나감", pts:10, type:"radio"},
    {k:"b", label:"식물 뿌리가 완전히 뻗어 나감", pts:20, type:"radio"}],
    hint:"둘 중 하나만 고르세요."},
  {n:6, name:"잎꾼개미의 대소동", items:[
    {k:"a", label:"개미가 둥지에 닿아 있고, 둥지 안에 든 잎사귀 조각", pts:10, type:"count", max:3}]},
  {n:7, name:"거대한 곰팡이", items:[
    {k:"a", label:"균사체가 완전히 뻗어 나감", pts:20}]},
  {n:8, name:"덩굴", items:[
    {k:"a", label:"덩굴이 매트에 닿아 있음", pts:30}]},
  {n:9, name:"연구 플랫폼", items:[
    {k:"a", label:"연구 플랫폼이 올려짐", pts:10},
    {k:"b", label:"무인 카메라가 배치됨", pts:10},
    {k:"c", label:"씨앗이 더 이상 나무에 닿아 있지 않음", pts:10}]},
  {n:10, name:"연약한 미세서식지", items:[
    {k:"a", label:"거미줄이 원래 시작 위치에 있음", pts:10},
    {k:"b", label:"달팽이 서식지가 원래 시작 위치에 있음", pts:10}],
    hint:"로봇이 이 구역을 지나간 뒤에도 그대로인지 확인하세요."},
  {n:11, name:"과거로의 문", items:[
    {k:"a", label:"뿌리 덮개가 내려가 매트에 닿아 있음", pts:20}]},
  {n:12, name:"숲의 장로", items:[
    {k:"a", label:"지지대가 완전히 세워져 나무에 닿아 있음", pts:20},
    {k:"b", label:"지지대 끈이 기둥에 감겨 있음", pts:10}]},
  {n:13, name:"핵심종", items:[
    {k:"a", label:"핵심종이 복원 플랫폼에 있고 어린 나무들이 세워져 있음", pts:30}]},
  {n:14, name:"생명의 씨앗", items:[
    {k:"a", label:"숲 복원 스테이션 안에 든 씨앗", pts:5, type:"count", max:4},
    {k:"b", label:"그중 매트에 닿아 있는 씨앗", pts:5, type:"count", max:4, capBy:"a", bonus:true}]},
  {n:15, name:"생물 중심 건축", items:[
    {k:"a", label:"둥지 캐노피가 올려짐", pts:10},
    {k:"b", label:"정원 채광창이 완전히 밀어 넣어짐", pts:10},
    {k:"c", label:"퇴비 해치가 완전히 열려 매트에 닿아 있음", pts:10},
    {k:"d", label:"모형이 놓인 도크의 생태적 필요 완료 (광산: 캐노피 / 도시: 채광창 / 농장: 퇴비 해치)", pts:10, bonus:true}]},
];
MISSIONS.forEach(m=>{ m.items.forEach(it=>it.type=it.type||"check");
  m.max = m.items.reduce((s,it)=> it.type==="radio" ? s : s + it.pts*(it.type==="count"?it.max:1), 0)
        + Math.max(0,...m.items.filter(i=>i.type==="radio").map(i=>i.pts)); });

// ---- 상태 ----
const KEY="bioglow-camp-v2";
const DEFAULT_ROSTER = `1. 강규민 JOX5WH
2. 라예준 RBZC3I
3. 안예영 X962F6
4. 조아인 4I9MRB
5. 이진우 1LC9VK
6. 최예린 GFQW0N
7. 심유나 CBPD6H
8. 최윤지 274HJ7
9. 양하준 20W2KL
10. 이시후 9XGSCZ
11. 염은성 W8NS31
12. 유강민 D78SGD
13. 이하주 MYBS92
14. 손수호 OK7AQ9
15. 윤지아 88O1MV
16. 강서진 AJE19L
17. 정유나 I38QB4
18. 권지민 N4RA5Z`;
const TEAM_MAX=3;
function parseStudents(text){
  return text.split(/\n/).map(l=>l.trim().replace(/^\d+\s*[.)]\s*/,"")).filter(Boolean).map(l=>{
    const p=l.split(/\s+/); return {name:p[0], code:p.length>1?p[p.length-1]:""};
  });
}
let uid=1;
const newId=p=>p+Date.now().toString(36)+(uid++);
function pairTeams(ids){
  const teams=[];
  for(let i=0;i<ids.length;i+=2) teams.push({id:newId("t"),name:`${teams.length+1}조`,members:ids.slice(i,i+2)});
  return teams;
}
function defaultState(){
  const students=parseStudents(DEFAULT_ROSTER).map((s,i)=>({id:"s"+(i+1),...s}));
  return {students, teams:pairTeams(students.map(s=>s.id)), log:[]};
}
let state;
try{ state=JSON.parse(localStorage.getItem(KEY)); }catch(e){ state=null; }
if(!state||!Array.isArray(state.students)||!Array.isArray(state.teams)) state=defaultState();
const DEFAULT_INFO={year:"2026",host:"호서대학교 X 강원대학교",title:"장영실 [AI 로봇 미션 챌린지]",cls:"(3-B)",session:"2일차 5 ~ 8차시"};
state.info={...DEFAULT_INFO,...(state.info||{})};
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }

const stuById=sid=>state.students.find(s=>s.id===sid);
const teamOf=sid=>state.teams.find(t=>t.members.includes(sid));
const findStu=sid=>{ const s=stuById(sid); if(!s) return null; const t=teamOf(sid); return {...s,team:t||{name:"미배정"}}; };
const unassigned=()=>state.students.filter(s=>!teamOf(s.id));
// 점수는 팀 단위(tid). 예전 개인 기록(sid)은 그 학생의 현재 팀으로 옮긴다.
state.log.forEach(e=>{ if(!e.tid&&e.sid){ const t=teamOf(e.sid); if(t) e.tid=t.id; } });
try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
const teamById=tid=>state.teams.find(t=>t.id===tid);
const teamLabel=t=>t?`${t.name}`:"삭제된 팀";
const memberNames=t=>t.members.map(stuById).filter(Boolean).map(s=>s.name).join(" · ");
const scoreOf=tid=>state.log.filter(e=>e.tid===tid).reduce((a,e)=>a+e.pts,0);
const doneSet=tid=>new Set(state.log.filter(e=>e.tid===tid).map(e=>e.m));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");

// ---- 메인 화면 ----
function teamButton(t){
  const d=doneSet(t.id);
  return `<button class="stu tcard" type="button" data-tid="${t.id}" aria-label="${esc(t.name)} 채점하기">
    <span class="tc-name"><span class="team-name">${esc(t.name)}</span><span class="tc-mem">${esc(memberNames(t))}</span></span>
    <span class="stu-score num">${scoreOf(t.id)}<small>점</small></span>
    <span class="dots" aria-label="성공 미션 ${d.size}개">${MISSIONS.map(m=>`<span class="dot ${d.has(m.n)?"on":""}" title="M${pad(m.n)} ${m.name}">${m.n}</span>`).join("")}</span>
  </button>`;
}
function renderInfo(){
  const i=state.info;
  $("pEyebrow").innerHTML=`<span class="yr">${esc(i.year)}</span> ${esc(i.host)} <span class="ds">디지털새싹</span>`;
  $("pTitle").innerHTML=`${esc(i.title)}<span class="cls">${esc(i.cls)}</span>`;
  $("pSession").textContent=i.session; $("pSession").hidden=!i.session;
  document.title=`${i.title} ${i.cls} 점수판`;
}
$("logoImg").addEventListener("error",()=>{ $("logoImg").hidden=true; $("logoText").hidden=false; });
if($("logoImg").complete && !$("logoImg").naturalWidth){ $("logoImg").hidden=true; $("logoText").hidden=false; }
function render(){
  renderInfo();
  $("undoBtn").disabled=!state.log.length;
  const live=state.teams.filter(t=>t.members.length);
  const cards=live.map(teamButton);
  $("teams").innerHTML=cards.join("") || `<p class="empty">팀 설정에서 팀을 만들어 주세요.</p>`;

  const ranked=live.map(t=>({t,score:scoreOf(t.id),done:doneSet(t.id).size})).sort((a,b)=>b.score-a.score||b.done-a.done);
  $("stuCount").textContent=`${ranked.length}개 팀`;
  let prev=null, place=0;
  $("rank").innerHTML = ranked.filter(r=>r.score>0).map((r,i)=>{
    if(r.score!==prev){place=i+1;prev=r.score;}
    return `<li><span class="medal">${place}</span><span class="who">${esc(r.t.name)}<small>${esc(memberNames(r.t))}</small></span><span class="pts num">${r.score}</span></li>`;
  }).join("") || `<li class="empty">아직 기록이 없습니다. 팀 카드를 눌러 점수를 기록하세요.</li>`;

  $("mstat").innerHTML=MISSIONS.map(m=>{
    const c=new Set(state.log.filter(e=>e.m===m.n&&e.tid&&teamById(e.tid)).map(e=>e.tid)).size;
    return `<div class="ms ${c?"hit":"zero"}" title="${m.name}"><b>M${pad(m.n)}</b><span class="num">${c}</span></div>`;
  }).join("");
}
$("teams").addEventListener("click",e=>{ const b=e.target.closest(".stu"); if(b) openScore(b.dataset.tid); });

// ---- 모달 ----
let modalClose=null;
function openModal(html,cls="",onClose){
  $("modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalClose=onClose||null;
  $("ov").addEventListener("click",e=>{ if(e.target.id==="ov") closeModal(); });
}
function closeModal(){ $("modalRoot").innerHTML=""; const f=modalClose; modalClose=null; if(f) f(); }
document.addEventListener("keydown",e=>{ if(e.key!=="Escape") return; if($("codesView")) { $("codesView").remove(); return; } if($("ov")) closeModal(); });

// ---- 채점 ----
let cur={tid:null,m:null,sel:{}};
function openScore(tid){
  cur={tid,m:null,sel:{}};
  const t=teamById(tid);
  openModal(`<div class="m-head"><h3><em>${esc(t.name)}</em> <span style="font-size:1rem;color:var(--muted)">${esc(memberNames(t))}</span> · 성공한 미션 선택</h3>
      <span class="num" style="font-weight:700">현재 <span style="font-family:var(--f-display);font-size:1.5rem;color:var(--canopy)">${scoreOf(tid)}</span>점</span>
      <button class="btn" type="button" id="closeScore">닫기</button></div>
    <div class="score-wrap"><div class="mgrid" id="mgrid"></div><div class="detail" id="detail"></div></div>`);
  $("closeScore").onclick=closeModal;
  $("mgrid").addEventListener("click",e=>{ const t=e.target.closest(".mtile"); if(t){ cur.m=+t.dataset.m; cur.sel={}; drawScore(); }});
  $("detail").addEventListener("click",onDetailClick);
  drawScore();
}
function itemValue(m,it){
  const v=cur.sel[it.k];
  if(it.type==="count") return (v||0)*it.pts;
  if(!v) return 0;
  if(it.req && !cur.sel[it.req]) return 0;
  return it.pts;
}
function total(m){ return m.items.reduce((a,it)=>a+itemValue(m,it),0); }
function drawScore(){
  const d=doneSet(cur.tid);
  $("mgrid").innerHTML=MISSIONS.map(m=>`<button type="button" class="mtile ${d.has(m.n)?"done":""} ${cur.m===m.n?"sel":""}" data-m="${m.n}">
    <span class="no">M${pad(m.n)}</span><span class="nm">${m.name}</span><span class="mx">최대 ${m.max}점</span></button>`).join("");
  const m=MISSIONS.find(x=>x.n===cur.m);
  if(!m){ $("detail").innerHTML=`<div class="placeholder">왼쪽에서 이번에 도전한 미션을 고르세요.<br><small>✓ 표시는 이미 성공한 미션입니다. 다시 성공해도 누적됩니다.</small></div>`; return; }
  const rows=m.items.map(it=>{
    const locked = it.req && !cur.sel[it.req];
    if(it.type==="count"){
      const cap = it.capBy ? (cur.sel[it.capBy]||0) : it.max;
      const v=Math.min(cur.sel[it.k]||0,cap); cur.sel[it.k]=v;
      return `<div class="item ${v?"on":""} ${cap===0?"off":""}"><span class="pv num">${it.pts}점×</span>
        <span class="lb ${it.bonus?"bonus":""}">${it.label}</span>
        <span class="stepper"><button type="button" data-dec="${it.k}" aria-label="줄이기">−</button><output class="num">${v}</output><button type="button" data-inc="${it.k}" data-cap="${cap}" aria-label="늘리기">+</button></span></div>`;
    }
    const on=!!cur.sel[it.k]&&!locked;
    return `<button type="button" class="item ${it.type==="radio"?"radio":""} ${on?"on":""} ${locked?"off":""}" data-k="${it.k}" ${locked?"disabled":""}>
      <span class="box">${on?"✓":""}</span><span class="lb ${it.bonus?"bonus":""}">${it.label}</span><span class="pv num">+${it.pts}</span></button>`;
  }).join("");
  const t=total(m);
  $("detail").innerHTML=`<h4>M${pad(m.n)} ${m.name}</h4>
    ${m.hint?`<p class="hint">${m.hint}</p>`:""}
    ${rows}
    <div class="sum"><span class="total num">+${t}점</span><button class="btn primary" type="button" id="commit" ${t?"":"disabled"}>점수 기록</button></div>`;
}
function onDetailClick(e){
  const m=MISSIONS.find(x=>x.n===cur.m); if(!m) return;
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="commit") return commit(m);
  if(b.dataset.inc){ const k=b.dataset.inc; cur.sel[k]=Math.min((cur.sel[k]||0)+1,+b.dataset.cap); }
  else if(b.dataset.dec){ const k=b.dataset.dec; cur.sel[k]=Math.max((cur.sel[k]||0)-1,0); }
  else if(b.dataset.k){
    const it=m.items.find(i=>i.k===b.dataset.k);
    if(it.type==="radio"){ const was=cur.sel[it.k]; m.items.filter(i=>i.type==="radio").forEach(i=>cur.sel[i.k]=false); cur.sel[it.k]=!was; }
    else { cur.sel[it.k]=!cur.sel[it.k]; m.items.filter(i=>i.req===it.k&&!cur.sel[it.k]).forEach(i=>cur.sel[i.k]=false); }
  }
  drawScore();
}
function commit(m){
  const pts=total(m); if(!pts) return;
  const detail=m.items.filter(it=>itemValue(m,it)>0).map(it=>it.type==="count"?`${it.label} ${cur.sel[it.k]}개`:it.label).join(" · ");
  const id=(state.log.reduce((a,e)=>Math.max(a,e.id),0))+1;
  state.log.push({id,tid:cur.tid,m:m.n,pts,detail,t:Date.now()});
  save();
  const tid=cur.tid, tm=teamById(tid);
  closeModal(); render(); celebrate(tid,pts);
  toast(`${tm.name} · M${pad(m.n)} ${m.name} +${pts}점`);
}
function celebrate(tid,pts){
  const el=document.querySelector(`.stu[data-tid="${tid}"]`); if(!el) return;
  el.classList.add("flash");
  const p=document.createElement("span"); p.className="pop"; p.textContent=`+${pts}`; el.appendChild(p);
  setTimeout(()=>{p.remove();el.classList.remove("flash");},1500);
}
let toastTimer;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2600); }

// ---- 되돌리기 ----
$("undoBtn").onclick=()=>{
  const last=state.log[state.log.length-1]; if(!last) return;
  openModal(`<div class="m-head"><h3>마지막 기록을 취소할까요?</h3></div>
    <p style="margin:0;font-size:1.1rem"><b>${esc(teamLabel(teamById(last.tid)))}</b> · M${pad(last.m)} ${MISSIONS[last.m-1].name} · <b>+${last.pts}점</b></p>
    <div class="row"><span class="spacer"></span><button class="btn" type="button" id="no">아니요</button><button class="btn danger" type="button" id="yes">기록 취소</button></div>`,"narrow");
  $("no").onclick=closeModal;
  $("yes").onclick=()=>{ state.log.pop(); save(); closeModal(); render(); toast("마지막 기록을 취소했습니다"); };
};

// ---- 기록 보기 ----
function openLog(){
  const fmt=t=>new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false});
  const items=[...state.log].reverse().map(e=>{
    return `<li><time>${fmt(e.t)}</time><span class="d"><b>${esc(teamLabel(teamById(e.tid)))}</b> · M${pad(e.m)} ${MISSIONS[e.m-1].name}<small>${esc(e.detail||"")}</small></span><span class="p num">+${e.pts}</span><button type="button" data-del="${e.id}">삭제</button></li>`;}).join("");
  openModal(`<div class="m-head"><h3>점수 기록 <span style="font-size:1rem;color:var(--muted)">${state.log.length}건</span></h3>
    <button class="btn" type="button" id="csvBtn">결과표 복사</button><button class="btn" type="button" id="closeLog">닫기</button></div>
    ${items?`<ul class="loglist" id="loglist">${items}</ul>`:`<p class="empty">아직 기록이 없습니다.</p>`}
    <p class="help">잘못 누른 기록은 [삭제]를 두 번 눌러 지웁니다. 결과표 복사는 엑셀이나 구글 시트에 바로 붙여넣을 수 있는 표 형식입니다.</p>`,"narrow");
  $("closeLog").onclick=closeModal;
  $("csvBtn").onclick=()=>copyText(resultTable(),"결과표를 복사했습니다");
  const ll=$("loglist");
  if(ll) ll.addEventListener("click",e=>{ const b=e.target.closest("[data-del]"); if(!b) return;
    if(!b.classList.contains("confirm")){ b.classList.add("confirm"); b.textContent="정말 삭제"; return; }
    state.log=state.log.filter(x=>x.id!==+b.dataset.del); save(); render(); openLog(); });
}
$("logBtn").onclick=openLog;
function resultTable(){
  const head=["팀","팀원","총점",...MISSIONS.map(m=>`M${pad(m.n)}`)];
  const rows=state.teams.filter(t=>t.members.length).map(t=>[t.name,memberNames(t),scoreOf(t.id),...MISSIONS.map(m=>state.log.filter(e=>e.tid===t.id&&e.m===m.n).reduce((a,e)=>a+e.pts,0)||"")]);
  const stu=[[],["번호","이름","팀","팀 점수","설문 코드"],...state.students.map((s,i)=>{ const t=teamOf(s.id); return [i+1,s.name,t?t.name:"",t?scoreOf(t.id):"",s.code]; })];
  return [head,...rows,...stu].map(r=>r.join("\t")).join("\n");
}
function copyText(text,msg){
  const fallback=()=>{
    openModal(`<div class="m-head"><h3>아래 내용을 복사하세요</h3><button class="btn" type="button" id="cx">닫기</button></div><textarea id="copyArea" readonly>${esc(text)}</textarea>`,"narrow");
    $("cx").onclick=closeModal; const a=$("copyArea"); a.focus(); a.select();
  };
  if(!navigator.clipboard) return fallback();
  navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(fallback);
}

// ---- 팀 설정 ----
function openSetup(){
  openModal(`<div class="m-head"><h3>팀 설정</h3><button class="btn primary" type="button" id="closeSetup">완료</button></div>
    <section class="sec" style="border-top:0;padding-top:0">
      <div class="row"><h4>팀 구성</h4><span class="spacer"></span>
        <button class="btn" type="button" id="addTeam">+ 팀 추가</button>
        <button class="btn" type="button" id="shuffleBtn">무작위로 짝 짓기</button>
        <button class="btn" type="button" id="clearTeams">모두 미배정으로</button></div>
      <p class="help">이름을 끌어서 팀 칸에 넣으세요. 끌기가 어려우면 이름을 한 번 누른 뒤 넣을 팀을 누르면 됩니다. 팀에 있는 이름 위에 놓으면 두 학생 자리가 바뀝니다.<br>점수는 팀에 쌓입니다. 학생을 다른 팀으로 옮겨도 팀 점수는 그 팀에 남습니다.</p>
      <div class="builder" id="builder"></div>
    </section>
    <details class="sec"><summary>프로그램 정보 (상단 제목)</summary>
      <div class="info-grid">${[["year","연도"],["host","주관"],["title","프로그램 이름"],["cls","반"],["session","일차 · 차시"]].map(([k,l])=>`<label for="info-${k}">${l}<input type="text" id="info-${k}" data-info="${k}" value="${esc(state.info[k])}"></label>`).join("")}</div>
    </details>
    <details class="sec"><summary>학생 명단 고치기</summary>
      <p class="help">한 줄에 한 명씩 <b>번호. 이름 코드</b> 형식입니다. 이름이 같으면 점수가 유지됩니다. 줄을 지운 학생은 점수 기록도 함께 지워집니다.</p>
      <textarea id="roster">${esc(state.students.map((s,i)=>`${i+1}. ${s.name} ${s.code}`).join("\n"))}</textarea>
      <div class="row"><button class="btn primary" type="button" id="saveRoster">명단 적용</button></div>
    </details>
    <section class="sec">
      <h4>데이터</h4>
      <div class="row"><button class="btn" type="button" id="backupBtn">백업 복사</button><button class="btn" type="button" id="restoreBtn">백업 붙여넣기</button>
        <span class="spacer"></span><button class="btn danger" type="button" id="resetBtn">점수 모두 지우기</button></div>
      <div id="setupExtra"></div>
    </section>
    <section class="sec">
      <h4>수업 마무리</h4>
      <div class="row"><button class="btn primary" type="button" id="codesBtn">설문 코드 전체 보기</button>
      <span class="help">학생 전원의 설문조사 코드를 큰 화면으로 띄웁니다.</span></div>
    </section>`,"wide");
  $("closeSetup").onclick=closeModal;
  document.querySelectorAll("[data-info]").forEach(inp=>inp.addEventListener("input",()=>{ state.info[inp.dataset.info]=inp.value; save(); renderInfo(); }));
  drawBuilder(); bindBuilder();
  $("addTeam").onclick=()=>{ state.teams.push({id:newId("t"),name:`${state.teams.length+1}조`,members:[]}); commitTeams(); };
  armButton($("shuffleBtn"),"한 번 더 누르면 무작위로 다시 짝 짓습니다",()=>{
    const ids=state.students.map(s=>s.id).sort(()=>Math.random()-.5);
    state.teams=pairTeams(ids); commitTeams(); toast("무작위로 짝을 지었습니다"); });
  armButton($("clearTeams"),"한 번 더 누르면 모든 팀이 비워집니다",()=>{ state.teams.forEach(t=>t.members=[]); commitTeams(); });
  $("saveRoster").onclick=()=>{
    const list=parseStudents($("roster").value);
    if(!list.length){ toast("명단이 비어 있습니다. 한 줄에 한 명씩 적어 주세요."); return; }
    const used=new Set();
    const students=list.map(p=>{ const old=state.students.find(s=>s.name===p.name&&!used.has(s.id));
      const id=old?old.id:newId("s"); used.add(id); return {id,name:p.name,code:p.code}; });
    const ids=new Set(students.map(s=>s.id));
    state.students=students;
    state.teams.forEach(t=>t.members=t.members.filter(id=>ids.has(id)));
    commitTeams(); toast(`학생 ${students.length}명을 적용했습니다`);
  };
  armButton($("resetBtn"),"한 번 더 누르면 모든 점수가 지워집니다",()=>{ state.log=[]; save(); render(); closeModal(); toast("모든 점수를 지웠습니다"); });
  $("backupBtn").onclick=()=>copyText(JSON.stringify(state),"백업 데이터를 복사했습니다. 메모장 등에 붙여넣어 보관하세요.");
  $("restoreBtn").onclick=()=>{
    $("setupExtra").innerHTML=`<label for="restoreArea" class="help"><b>백업 데이터 붙여넣기</b></label><textarea id="restoreArea" style="min-height:6rem"></textarea>
      <div class="row" style="margin-top:.5rem"><button class="btn primary" type="button" id="doRestore">복원</button></div>`;
    $("doRestore").onclick=()=>{
      try{ const s=JSON.parse($("restoreArea").value); if(!Array.isArray(s.students)||!Array.isArray(s.teams)||!Array.isArray(s.log)) throw 0;
        state=s; state.info={...DEFAULT_INFO,...(s.info||{})}; save(); closeModal(); render(); toast("백업을 복원했습니다");
      }catch(_){ toast("백업 형식이 아닙니다. [백업 복사]로 받은 내용을 그대로 붙여넣어 주세요."); }
    };
  };
  $("codesBtn").onclick=()=>{ closeModal(); openCodes(); };
}
function armButton(b,armedText,fn){
  const orig=b.textContent;
  b.onclick=()=>{ if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=armedText; b.classList.add("danger");
      setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent=orig; if(b.id!=="resetBtn") b.classList.remove("danger"); } },4000); return; }
    delete b.dataset.armed; b.textContent=orig; fn(); };
}
function commitTeams(){ save(); drawBuilder(); render(); }

let picked=null;
function chipHtml(s){ return `<span class="chip ${picked===s.id?"sel":""}" data-sid="${s.id}">${esc(s.name)}</span>`; }
function drawBuilder(){
  const b=$("builder"); if(!b) return;
  const un=unassigned();
  b.innerHTML=`<div class="pool"><div class="zone ${picked?"pick":""}" data-drop="pool">
      <div class="zone-h">미배정 학생 ${un.length}명</div>
      <div class="chips">${un.map(chipHtml).join("") || `<span class="help">모두 팀에 들어갔습니다</span>`}</div></div></div>
    <div class="tgrid">${state.teams.map(t=>`<div class="zone tbox ${picked?"pick":""}" data-drop="${t.id}">
      <div class="tbox-h"><input type="text" id="tn-${t.id}" value="${esc(t.name)}" data-tname="${t.id}" aria-label="팀 이름"><button type="button" data-deltm="${t.id}" aria-label="${esc(t.name)} 삭제" title="팀 삭제">✕</button></div>
      <div class="slots">${t.members.map(stuById).filter(Boolean).map(chipHtml).join("")}${t.members.length<2?Array(2-t.members.length).fill(`<div class="slot-empty">여기에 끌어 넣기</div>`).join(""):""}</div>
    </div>`).join("")}</div>`;
}
function placeStudent(sid,zoneId,onSid){
  const src=teamOf(sid);
  if(onSid && onSid!==sid && zoneId!=="pool"){
    const dest=teamOf(onSid);
    if(dest===src) return;
    dest.members[dest.members.indexOf(onSid)]=sid;
    if(src) src.members[src.members.indexOf(sid)]=onSid;
    commitTeams(); return;
  }
  if(zoneId==="pool"){ if(src){ src.members=src.members.filter(x=>x!==sid); commitTeams(); } return; }
  const dest=state.teams.find(t=>t.id===zoneId); if(!dest||dest===src) return;
  if(dest.members.length>=TEAM_MAX){ toast(`한 팀은 ${TEAM_MAX}명까지 넣을 수 있습니다. 이름 위에 놓으면 자리를 바꿉니다.`); return; }
  if(src) src.members=src.members.filter(x=>x!==sid);
  dest.members.push(sid); commitTeams();
}
function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y); if(!el) return null;
  const zone=el.closest("[data-drop]"); if(!zone) return null;
  const chip=el.closest(".chip");
  return {zone:zone.dataset.drop, onSid:chip?chip.dataset.sid:null, zoneEl:zone, chipEl:chip};
}
function bindBuilder(){
  const b=$("builder"); let drag=null, overEls=[];
  const clearOver=()=>{ overEls.forEach(e=>e.classList.remove("over")); overEls=[]; };
  b.addEventListener("pointerdown",e=>{
    const chip=e.target.closest(".chip"); if(!chip||e.button>0) return;
    drag={sid:chip.dataset.sid,x:e.clientX,y:e.clientY,chip,moved:false,ghost:null};
    try{ chip.setPointerCapture(e.pointerId); }catch(_){}
  });
  b.addEventListener("pointermove",e=>{
    if(!drag) return;
    if(!drag.moved){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
      drag.moved=true; drag.ghost=drag.chip.cloneNode(true); drag.ghost.classList.add("ghost"); drag.ghost.classList.remove("sel");
      document.body.appendChild(drag.ghost); drag.chip.classList.add("dragging"); }
    drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px";
    clearOver(); const t=dropTargetAt(e.clientX,e.clientY);
    if(t){ const el=(t.chipEl&&t.zone!=="pool")?t.chipEl:t.zoneEl; el.classList.add("over"); overEls.push(el); }
  });
  const end=e=>{
    if(!drag) return; const d=drag; drag=null; clearOver();
    if(d.ghost) d.ghost.remove(); d.chip.classList.remove("dragging");
    if(e.type==="pointercancel") return;
    if(d.moved){ picked=null; const t=dropTargetAt(e.clientX,e.clientY); if(t) placeStudent(d.sid,t.zone,t.onSid); else drawBuilder(); return; }
    // 탭: 선택하거나, 선택된 학생과 자리 바꾸기
    if(picked && picked!==d.sid){ const s=picked; picked=null; const z=d.chip.closest("[data-drop]").dataset.drop;
      if(z==="pool"){ picked=d.sid; drawBuilder(); } else placeStudent(s,z,d.sid); return; }
    picked = picked===d.sid ? null : d.sid; drawBuilder();
  };
  b.addEventListener("pointerup",end); b.addEventListener("pointercancel",end);
  b.addEventListener("click",e=>{
    if(e.target.closest(".chip")||e.target.closest("input")) return;
    const del=e.target.closest("[data-deltm]");
    if(del && scoreOf(del.dataset.deltm)>0 && !del.dataset.armed){ del.dataset.armed="1"; del.textContent="삭제?"; del.style.width="auto"; del.style.color="var(--danger)"; toast("이 팀에는 점수가 있습니다. 한 번 더 누르면 팀과 점수가 함께 사라집니다."); return; }
    if(del){ state.teams=state.teams.filter(t=>t.id!==del.dataset.deltm); picked=null; commitTeams(); return; }
    const zone=e.target.closest("[data-drop]");
    if(zone&&picked){ const s=picked; picked=null; placeStudent(s,zone.dataset.drop,null); drawBuilder(); }
  });
  b.addEventListener("input",e=>{ const id=e.target.dataset.tname; if(!id) return;
    const t=state.teams.find(x=>x.id===id); if(t){ t.name=e.target.value.trim()||t.name; save(); render(); } });
}
$("setupBtn").onclick=openSetup;

// ---- 설문 코드 ----
function openCodes(){
  const v=document.createElement("div"); v.className="codes"; v.id="codesView";
  v.innerHTML=`<div class="codes-h"><h2>설문조사 코드</h2><button class="btn primary" type="button" id="closeCodes">닫기</button>
    <p>내 이름 옆의 코드를 설문지에 그대로 입력하세요. 영어 대문자와 숫자로 되어 있어요.</p></div>
    <div class="cgrid">${state.students.map((s,i)=>`<div class="ccard"><span class="cn num">${i+1}</span><span class="cname">${esc(s.name)}</span><span class="ccode">${esc(s.code||"—")}</span></div>`).join("")}</div>`;
  document.body.appendChild(v);
  $("closeCodes").onclick=()=>v.remove();
}

// ---- 전체 화면 ----
$("fsBtn").onclick=()=>{
  const d=document;
  if(d.fullscreenElement) d.exitFullscreen().catch(()=>{});
  else (d.documentElement.requestFullscreen?.()||Promise.reject()).catch(()=>toast("이 화면에서는 전체 화면을 쓸 수 없습니다. 브라우저의 F11을 눌러 주세요."));
};

render();
</script>
